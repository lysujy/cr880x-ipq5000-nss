# Build IPQ50xx NSS firmware
#
# Builds OpenWrt firmware with Qualcomm NSS acceleration for IPQ50xx devices
# from the kuncy7/openwrt-nss-edma tree (branch c3po-tag-8021q, kernel 6.18).
#
# This repository holds the build scripts, configs, and device definitions
# the base tree does not have yet (dts/). The base tree is
# cloned at build time at a pinned commit (see base_ref). The nss feed comes
# from the base tree's feeds.conf.default (kuncy7/nss-packages, branch
# ipq50xx-rebase); pinning the feed by commit is a TODO, see below.
#
# On success, the workflow also publishes a GitHub Release with the
# firmware and buildinfo files (one release per run; a re-run gets a new
# tag because the run attempt is part of the tag).

name: Build IPQ50xx NSS firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device profile to build (must have a mapping in the 'Apply device config' step)"
        required: true
        default: "xiaomi_cr8806"
        type: choice
        options:
          - xiaomi_cr8806
          - xiaomi_cr8808
      firmware:
        description: "NSS firmware line. 12.5 is the default; 12.2 is the fallback. The driver is built for the firmware shipped, never mix them."
        required: true
        default: "12.5"
        type: choice
        options:
          - "12.5"
          - "12.2"
      base_ref:
        description: "kuncy7/openwrt-nss-edma commit to build. Default is the HEAD of c3po-tag-8021q as seen on the repo page on 2026-11-02; refresh it when rebasing."
        required: true
        default: "13e8bc914709c4794b3ec7b0421d2038386e697e"

# Release creation needs contents:write; the ccache step needs actions:write
# for cache save and restore (an explicit permissions block otherwise
# leaves the actions scope at none and the cache calls fail).
permissions:
  contents: write
  actions: write

env:
  BASE_REPO: https://github.com/kuncy7/openwrt-nss-edma.git
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ inputs.device }} (NSS FW ${{ inputs.firmware }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      # To add a device later: add its profile name here AND a mapping line in
      # the "Apply device config" step AND a config file in configs/.
      # If the base tree has no profile for it yet, also add its .dts and
      # .mk.inc to dts/ (the "Install custom devices" step injects them).
      matrix:
        device: ["${{ inputs.device }}"]
    steps:
      - name: Checkout scaffold repo
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev

      - name: Clone base tree at pinned commit
        run: |
          git init openwrt
          cd openwrt
          git remote add origin "$BASE_REPO"
          git fetch --depth 1 origin "${{ inputs.base_ref }}"
          git checkout FETCH_HEAD
          git log --oneline -1
          # Sanity: this must be the NSS tree, not plain OpenWrt.
          test -f README.ipq50xx.md

      - name: Install custom devices
        run: |
          cd openwrt
          # Devices the base tree does not have yet (e.g. M81) live in
          # this repo's dts/: a .dts file plus a .mk.inc device block.
          # Inject them into the base tree before defconfig. The
          # Device/Default rule derives the DTS name as
          # SOC-lastword(device name), so xiaomi_cr8808 ->
          # ipq5018-cr8808.dts; the .dts filename must match that rule.
          if ls ../dts/*.dts >/dev/null 2>&1; then
            cp ../dts/*.dts target/linux/qualcommax/dts/
            for inc in ../dts/*.mk.inc; do
              cat "$inc" >> target/linux/qualcommax/image/ipq50xx.mk
            done
          fi
          # M81 board data: the M81 image has no ipq-wifi package, so
          # fetch its board-2.bin files at build time from hzyitc's
          # redmi_ax3000 board files (pinned commit + sha256 check, so
          # the build is reproducible). hzyitc's 2.4 GHz file carries
          # two entries: board-id 0x10 (M79, ipa) and 0x24 (M81, epa);
          # the M81 DTS sets qcom,board_id = 0x24, so ath11k picks the
          # M81 entry. The 5G file has the shared board-id 0x60 entry.
          # Fail here, before the long build, if the fetch or the hash
          # check fails, instead of shipping an image whose Wi-Fi loads
          # the wrong board data (or none).
          if [ "${{ inputs.device }}" = "xiaomi_cr8808" ]; then
            HZY_COMMIT="ab1f9ffa5b5b62f252a5e87eb23f51f4e2544511"
            HZY_BASE="https://raw.githubusercontent.com/hzyitc/openwrt-redmi-ax3000/$HZY_COMMIT/package/firmware/ipq-wifi"
            mkdir -p ../files-xiaomi_cr8808/lib/firmware/ath11k/IPQ5018/hw1.0 \
                     ../files-xiaomi_cr8808/lib/firmware/ath11k/QCN6122/hw1.0
            curl -sL -o ../files-xiaomi_cr8808/lib/firmware/ath11k/IPQ5018/hw1.0/board-2.bin \
              "$HZY_BASE/board-redmi_ax3000.ipq5018"
            curl -sL -o ../files-xiaomi_cr8808/lib/firmware/ath11k/QCN6122/hw1.0/board-2.bin \
              "$HZY_BASE/board-redmi_ax3000.qcn6122"
            echo "a1d03029566e469ceee4d570324dfa015f3d01e351bc87c81329ffdd7a7c4186  ../files-xiaomi_cr8808/lib/firmware/ath11k/IPQ5018/hw1.0/board-2.bin" | sha256sum -c -
            echo "91c689226aa5a3af853063452393055c5e764866fec707ccd504738314e75134  ../files-xiaomi_cr8808/lib/firmware/ath11k/QCN6122/hw1.0/board-2.bin" | sha256sum -c -
          fi

      - name: Patch cr8806 NAND ECC to 4-bit (trigsoft chain)
        run: |
          cd openwrt
          # Build #6 diagnosis (2026-11-03): the kuncy7 base DTS forces
          # 8-bit NAND ECC, which is correct for a stock-U-Boot chain
          # but wrong for the trigsoft chain on this device: trigsoft's
          # modified U-Boot reads/writes NAND with 4-bit-compatible
          # ECC, so an 8-bit kernel cannot decode trigsoft-written
          # pages (UBI attach fails, no boot). HZYITC 5.4 (4-bit) and
          # ImmortalWrt (default = 4-bit) both boot via trigsoft web
          # flash; Build #6 (8-bit) was the only failure.
          # The cr8806 DTS lives in the base tree, not this repo, so
          # patch it in place. Fail closed: the 8-bit pattern must be
          # found exactly once, so a future base-tree change can't
          # silently skip this fix. (The M81 DTS is fixed repo-side in
          # dts/ipq5018-cr8808.dts; this step only affects cr8806.)
          DTS="target/linux/qualcommax/dts/ipq5018-cr8806.dts"
          test -f "$DTS" || { echo "ERROR: $DTS not found"; exit 1; }
          COUNT="$(grep -c 'nand-ecc-strength = <8>;' "$DTS" || true)"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one 'nand-ecc-strength = <8>;' in $DTS, found $COUNT"
            exit 1
          fi
          sed -i '/^&qpic_nand/,/^};/ s/nand-ecc-strength = <8>;/nand-ecc-strength = <4>;/' "$DTS"
          echo "--- after patch ---"
          grep -n 'nand-ecc-strength' "$DTS"
          if [ "$(grep -c 'nand-ecc-strength = <4>;' "$DTS" || true)" -ne 1 ]; then
            echo "ERROR: patch did not produce exactly one 4-bit strength"
            exit 1
          fi
          if [ "$(grep -c 'nand-ecc-strength = <8>;' "$DTS" || true)" -ne 0 ]; then
            echo "ERROR: 8-bit strength still present after patch"
            exit 1
          fi

      - name: Pin feeds to proven commits
        run: |
          cd openwrt
          # Reproducibility: the base tree's feeds.conf.default tracks
          # branches, and packages + luci moved between run #1 and run
          # #5. Copy the repo's pinned feeds.conf (run #5's exact feed
          # commits) so a rebuild pulls identical feed code.
          cp ../feeds.conf feeds.conf

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          # Unique key per run so a fresh cache is always saved; the
          # restore-keys prefix falls back to the latest previous cache.
          # GitHub evicts least-recently-used caches past the 10 GB repo
          # quota, so no explicit cleanup step is needed.
          key: ipq50xx-${{ inputs.device }}-ccache-${{ inputs.base_ref }}-${{ github.run_id }}
          restore-keys: |
            ipq50xx-${{ inputs.device }}-ccache-${{ inputs.base_ref }}-
          path: |
            openwrt/.ccache

      - name: Update and install feeds
        run: |
          cd openwrt
          # feeds.conf.default of the base tree already names the nss feed
          # (kuncy7/nss-packages, branch ipq50xx-rebase).
          # TODO: pin the nss feed by commit. After a known-good build, copy
          # the nss line from feeds.buildinfo into a feeds.conf, commit it in
          # this repo, and copy it over feeds.conf.default here.
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds list -r nss | grep -q qca-nss-drv && echo "nss feed OK"

      - name: Fetch extra packages
        run: |
          cd openwrt
          # Argon theme + config are not in the base feeds; track the
          # latest upstream master like the IPQ60xx project does.
          # Clone into package/, NOT feeds/: the build system picks up
          # package/ automatically, while ./scripts/feeds install only
          # works for packages registered in a feed index, so a manual
          # clone into feeds/ warns "No feed for package" and the
          # symbols get dropped by defconfig (this failed run #2).
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

      - name: Apply device config
        run: |
          cd openwrt
          # Map device profile -> config file in this repo.
          # Add one line per new device here.
          case "${{ matrix.device }}" in
            xiaomi_cr8806) CONFIG_FILE="cr8806-256m.config" ;;
            xiaomi_cr8808) CONFIG_FILE="cr8808-m81-256m.config" ;;
            *) echo "No config mapping for device: ${{ matrix.device }}" >&2; exit 1 ;;
          esac
          cp "../configs/${CONFIG_FILE}" .config
          # Firmware line selection. The driver is built for the firmware
          # shipped, so the two lines must never both be enabled.
          if [ "${{ inputs.firmware }}" = "12.2" ]; then
            sed -i 's/^CONFIG_NSS_FIRMWARE_VERSION_12_5=y/# CONFIG_NSS_FIRMWARE_VERSION_12_5 is not set/' .config
            echo 'CONFIG_NSS_FIRMWARE_VERSION_12_2=y' >> .config
          fi
          make defconfig
          # Fail fast if defconfig silently dropped a required symbol.
          # (A wrong symbol is dropped this way, which would otherwise
          # produce an image without the device or without NSS.)
          # Report EVERY missing symbol at once: a bare grep -q dies on
          # the first miss and never says which symbol failed, which is
          # how runs #2 and #3 stayed undiagnosed.
          fail=0
          for pat in \
            '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_${{ matrix.device }}=y$' \
            '^CONFIG_PACKAGE_nss-tools-dwmac=y$' \
            '^CONFIG_PACKAGE_nss-firmware=y$' \
            '^CONFIG_NSS_MEM_PROFILE_LOW=y$' \
            '^CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y$' \
            '^CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y$' \
            '^CONFIG_PACKAGE_zram-swap=y$' \
            '^CONFIG_PACKAGE_kmod-lib-lz4=y$' \
            '^CONFIG_KERNEL_ZRAM_BACKEND_LZ4=y$' \
            '^CONFIG_KERNEL_ZRAM_BACKEND_LZO=y$' \
            '^CONFIG_KERNEL_ZRAM_DEF_COMP_LZ4=y$' \
            '^CONFIG_PACKAGE_kmod-tcp-bbr=y$' \
            '^CONFIG_CCACHE=y$' \
            '^CONFIG_USE_LTO=y$' \
            '^CONFIG_PACKAGE_kmod-nft-nat=y$' \
            '^CONFIG_PACKAGE_luci-theme-argon=y$' \
            '^CONFIG_PACKAGE_luci-app-argon-config=y$' \
            '^CONFIG_PACKAGE_htop=y$' \
            '^CONFIG_PACKAGE_zoneinfo-asia=y$' \
            '^CONFIG_PACKAGE_luci-app-upnp=y$' \
            '^CONFIG_PACKAGE_tcpdump-mini=y$' \
            '^CONFIG_PACKAGE_sqm-scripts-nss=y$' \
            '^CONFIG_PACKAGE_luci-app-sqm=y$' \
            '^CONFIG_PACKAGE_kmod-ifb=y$' \
            '^CONFIG_PACKAGE_ca-bundle=y$' \
            '^CONFIG_PACKAGE_kmod-ath11k=y$' \
            '^CONFIG_PACKAGE_wpad-basic-mbedtls=y$' \
            '^CONFIG_PACKAGE_luci-theme-bootstrap=y$' \
            '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' \
            '^CONFIG_PACKAGE_adblock=y$' \
            '^CONFIG_PACKAGE_dnsmasq-full=y$' \
            ; do
            grep -q "$pat" .config || { echo "MISSING: $pat"; fail=1; }
          done
          # O3 flags: confirm the custom CPU flags survived defconfig.
          grep -q 'mcpu=cortex-a53' .config || { echo "MISSING: O3 mcpu flag"; fail=1; }
          # NSS bridge-mgr is ipq807x/ipq60xx-only (see config comment),
          # so it is deliberately NOT checked here.
          if [ "${{ inputs.firmware }}" = "12.5" ]; then
            grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_5=y$' .config || { echo "MISSING: NSS_FIRMWARE_VERSION_12_5"; fail=1; }
          else
            grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_2=y$' .config || { echo "MISSING: NSS_FIRMWARE_VERSION_12_2"; fail=1; }
          fi
          [ "$fail" = 0 ] || exit 1

      - name: Install files overlay
        run: |
          cd openwrt
          # Anything in this repo's files/ is baked into the image rootfs.
          # uci-defaults scripts must be executable in the image, and the
          # snapshot push stores them as 0644, so chmod them here.
          if [ -d ../files ]; then
            mkdir -p files
            cp -r ../files/. files/
            chmod +x files/etc/uci-defaults/* 2>/dev/null || true
          fi
          # Per-device overlay (e.g. files-xiaomi_cr8808/): applied after
          # files/, so it can override shared files. M81 board data
          # lives here, not in files/, so the M79 image never picks it up.
          if [ -d "../files-${{ matrix.device }}" ]; then
            cp -r "../files-${{ matrix.device }}/." files/
          fi

      - name: Download sources
        run: |
          cd openwrt
          make download -j"$(nproc)"
          # Drop empty downloads so a truncated file cannot poison the build.
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd openwrt
          echo "Build started: $(date)"
          make -j"$(nproc)" || make -j1 V=s
          echo "Build finished: $(date)"

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cd openwrt
          cp bin/targets/qualcommax/ipq50xx/*"${{ matrix.device }}"*sysupgrade.bin ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/*"${{ matrix.device }}"*initramfs* ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/*"${{ matrix.device }}"*factory.ubi ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/config.buildinfo ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/feeds.buildinfo ../artifacts/ 2>/dev/null || true
          # The sysupgrade image and the factory image are mandatory;
          # fail loudly without them so a release is never incomplete.
          ls ../artifacts/*sysupgrade.bin
          ls ../artifacts/*factory.ubi
          cd ../artifacts && sha256sum * > sha256sums.txt
          ls -l ../artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ipq50xx-${{ matrix.device }}-nss-fw${{ inputs.firmware }}
          path: artifacts/
          if-no-files-found: error

      - name: Set release tag
        run: |
          DATE="$(date +'%Y.%m.%d')"
          echo "RELEASE_TAG=${{ matrix.device }}-${DATE}-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${{ matrix.device }} NSS FW ${{ inputs.firmware }} - ${DATE} (Build #${{ github.run_number }}, attempt ${{ github.run_attempt }})" >> "$GITHUB_ENV"
          # Supported models per firmware profile, so every release
          # states which hardware it may be flashed on. ALT models
          # (same profile, same DTS) count as supported for install,
          # on-device testing is tracked separately in the README.
          case "${{ matrix.device }}" in
            xiaomi_cr8806) SUPPORTED_MODELS="Xiaomi CR8806 (A版 M79), Xiaomi CR8808 (A版 M79), Xiaomi CR8809 (A版 M79)" ;;
            xiaomi_cr8808) SUPPORTED_MODELS="Xiaomi CR8808 (A版 M81)" ;;
            *) SUPPORTED_MODELS="${{ matrix.device }}" ;;
          esac
          echo "SUPPORTED_MODELS=$SUPPORTED_MODELS" >> "$GITHUB_ENV"

      - name: Publish release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          artifacts: "artifacts/*"
          allowUpdates: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            IPQ50xx NSS firmware build (kernel 6.18, NSS firmware ${{ inputs.firmware }}).

            - Device profile: ${{ matrix.device }}
            - Supported models: ${{ env.SUPPORTED_MODELS }}
            - Base tree: kuncy7/openwrt-nss-edma, branch c3po-tag-8021q, commit ${{ inputs.base_ref }}
            - Build: #${{ github.run_number }}, attempt ${{ github.run_attempt }}

            Attached files: sysupgrade image, factory image, initramfs image (if built), config.buildinfo, feeds.buildinfo, sha256sums.txt. Exact feed commits are in feeds.buildinfo.

            First install: UART + TFTP, boot the initramfs image, then write factory.ubi from the booted system to the other slot; later upgrades use sysupgrade.

            WARNING: factory.ubi is an OpenWrt UBI image for the firmware UBI partition, not OEM firmware. Install it only from a booted OpenWrt initramfs system to that partition (first-install path above). Flashing it to any other partition — including through a bootloader web recovery pointed at the wrong target — bricks the device (confirmed 2026-11-03). Do not sysupgrade to this firmware from a system with a different partition layout (e.g. a merged single-UBI layout); use the first-install path above.

            Flash only the listed models. Do not flash across models, board revisions (M79/M81) or A/B versions; a wrong image can brick the device.

      # Cleanup runs only when the build succeeded, and never fails the
      # job: the release above is already published by then, and the user
      # only needs the release to stay normal. Cache save happens in the
      # cache step's post-action, after these steps, so the fresh cache
      # survives while older entries are deleted.
      - name: Delete old caches
        continue-on-error: true
        run: |
          gh cache list --key "ipq50xx-${{ inputs.device }}-ccache-${{ inputs.base_ref }}-" --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 2
          keep_minimum_runs: 0
